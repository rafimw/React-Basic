<!DOCTYPE html>
<html>
  <head>
    <title>Asistenya Rafi</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="ReactBasic.js"></script> <!--  Load konsole dari file .js -->
    <script src="https://unpkg.com/supersimpledev@8.6.4/external-library.js"></script>  <!-- Load konsole dari file eksternal -->

    <!--###########################################################################################################################-->

    <script src="https://unpkg.com/supersimpledev/react.js"></script> <!--  Load React for shared devices such as smartphones and tablets -->
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script> <!-- Load React for a specific website -->

    <!--###########################################################################################################################-->
    
    <script src="https://unpkg.com/supersimpledev/babel.js"></script> <!--adasdasdas-->
    <script type="text/babel"> // ini untuk memuat variable untuk di render ke dalam ReactDOM tetapi hanya satu per satu
        //Function 1. untuk chat boxnya
        function ChatInput() {
          return (
            <>
              <input 
              placeholder="Mau tanya apa ke rafi ?" 
              size = "30" 
              />
              <button>Send</button>
            </>
          )
        }

        //Function 2. untuk chat massage
        // ini adalah cara menulis props dengan cara destructuring, sehingga tidak perlu menulis props.message dan props.sender
        function ChatMessage({ message, sender }) { 
          //const { message, sender } = props; 
          // ini adalah cara lain untuk menulis 
          // const message = props.message; 
          // const sender = props.sender;

          //ini adalah cara panjang if
          /*
          if (sender === "Robot") {
            return (
                <div>
                <img src="Robot.png" width="50" /> 
                {message}
                </div>
            )
          }
          */
          
          //Ini Adalah JSX
          return (
                <div>
                  {sender === "Robot" && (
                    <img src="Robot.png" width="50" />
                  )}

                  {message}

                  {sender === "User" && (
                    <img src="People.png" width="50" />
                  )}
                </div>
            )
        }
        
        function Apps () {
          return (
            <div>
              <ChatInput />
              <ChatMessage 
                message="Halo Kawan" 
                sender="User" 
              />
              <ChatMessage 
                message="Gimana Kawaaannn ???" 
                sender="Robot" 
              />
              <ChatMessage 
                message="Kamu lagi apa nih ???" 
                sender="User" 
              />
              <ChatMessage 
                message="Aku lagi belajar React nih, anjaaaayyyyy" 
                sender="Robot" 
              />
            </div>
          )
        }

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<Apps />); 
    </script>

    <!--###########################################################################################################################-->

  </body>
</html>
